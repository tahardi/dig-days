name: App

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'app/**'
              - 'api/**'
              - '.github/workflows/app.yml'

  app-format:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: './app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Check
        run: npm run format:check

  app-lint:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: './app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Check
        run: npm run lint

  app-typecheck:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: './app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Check
        run: npm run typecheck

  app-deps:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    env:
      CI: 1
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: './app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Check
        run: npm run deps:check

  app-test:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: './app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Check
        run: npm run test
