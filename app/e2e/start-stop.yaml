appId: com.tahardi.digdays
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
- extendedWaitUntil:
    visible:
      id: 'tab-index'
    timeout: 60000
- tapOn:
    id: 'start-button'
- assertVisible:
    id: 'elapsed-timer'
- tapOn:
    id: 'stop-button'
- assertVisible: 'Record'
